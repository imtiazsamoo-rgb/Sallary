<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="IBFS Salary Management Portal — Manage school salaries, attendance, petty cash, and employee records securely." />
  <meta name="theme-color" content="#6366f1" />
  <title>IBFS Salary Management Portal</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="logo.png" />

  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- =====================================================================
       Login Screen
       ===================================================================== -->
  <div id="loginView" class="login-view">
    <div class="login-card">
      <div class="login-header">
        <img src="logo.png" alt="IBFS Logo" style="height: 50px; width: auto; object-fit: contain; flex-shrink: 0;">
        <div class="logo-text">
          <h1>IBFS Portal</h1>
          <p>Salary Management System</p>
        </div>
      </div>

      <h2>Welcome Back</h2>
      <p class="login-subtitle">Sign in to manage salaries, attendance, and approvals.</p>

      <div id="loginMsg"></div>

      <form id="loginForm" onsubmit="return false;" autocomplete="on">
        <div class="form-group">
          <label for="emailInput">Email Address</label>
          <input id="emailInput" type="email" autocomplete="username" placeholder="name@domain.com" required>
        </div>
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input id="passwordInput" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <button class="btn primary btn-full" id="loginBtn" type="submit" style="padding: 14px; font-size: 15px; margin-top: 4px; letter-spacing: 0.2px;">
          Sign In →
        </button>
      </form>


    </div>
  </div>

  <!-- =====================================================================
       Core App Layout
       ===================================================================== -->
  <div id="app" class="app-layout hidden">

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="app-sidebar">
      <!-- Brand Header -->
      <div class="sidebar-brand">
        <div style="display: flex; align-items: center; gap: 12px;">
          <img src="logo.png" alt="IBFS Logo" style="height: 34px; width: auto; object-fit: contain; filter: brightness(1.1);">
          <div class="logo-text">
            <h1>IBFS Portal</h1>
            <p>Enterprise Suite</p>
          </div>
        </div>
        <button id="closeSidebarBtn" class="btn-close-sidebar mobile-only" aria-label="Close menu">✕</button>
      </div>

      <!-- Scrollable Content -->
      <div class="sidebar-scroll-area">
        <!-- User Profile Box -->
        <div class="user-profile-box">
          <div class="user-avatar" id="avatarName" aria-hidden="true">U</div>
          <div class="user-info">
            <h3 id="sideName">Loading User...</h3>
            <p id="sideMeta">Role | School</p>
          </div>
        </div>

        <!-- Dynamic Navigation Menu -->
        <nav id="menu" class="sidebar-menu" aria-label="Main Navigation"></nav>
      </div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <p class="sidebar-footer-text">
          IBFS Portal v2.0<br>
          Salary Management System
        </p>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Top Header Bar -->
      <header class="app-header" role="banner">
        <div class="header-left">
          <button id="menuBtn" class="btn-menu-toggle mobile-only" aria-label="Toggle sidebar menu" aria-expanded="false">☰</button>
          <button id="headerBackBtn" class="btn hidden" onclick="openPage('Dashboard')" aria-label="Go back to Dashboard">← Back</button>
          <div class="page-title-area">
            <h2 id="title">Dashboard</h2>
            <p id="subtitle">Fast live summary from Apps Script</p>
          </div>
        </div>

        <div class="header-actions" role="complementary">
          <div class="header-action-item">
            <label class="sr-only" for="globalMonth">Select Month</label>
            <input id="globalMonth" type="month" aria-label="Select month for reports" title="Select month">
          </div>
          <span id="networkPill" class="status-pill status-online" aria-live="polite" title="Network status">Online</span>
          <span id="schoolPill" class="badge-pill" aria-label="Assigned school">School: -</span>
          <button id="logoutBtn" class="btn danger btn-sm" aria-label="Sign out">Sign Out</button>
        </div>
      </header>

      <!-- Dynamic Screen Content -->
      <main class="app-content" id="mainContent" role="main">
        <div id="content"></div>
      </main>
    </div>
  </div>

  <!-- =====================================================================
       Image Preview Lightbox
       ===================================================================== -->
  <div id="photoModal" class="photo-lightbox hidden" role="dialog" aria-modal="true" aria-label="Image preview">
    <div class="lightbox-toolbar">
      <button class="btn-lightbox-action" onclick="rotatePhoto(-90)" aria-label="Rotate left">↺ Left</button>
      <button class="btn-lightbox-action" onclick="rotatePhoto(90)" aria-label="Rotate right">↻ Right</button>
      <button class="btn-lightbox-action close" onclick="closePhoto()" aria-label="Close preview">✕ Close</button>
    </div>
    <div class="lightbox-content">
      <img id="modalImage" alt="Preview Image" style="transform: rotate(0deg) scale(1); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);">
    </div>
  </div>

  <!-- =====================================================================
       General Purpose Popup Modal
       ===================================================================== -->
  <div id="generalModal" class="photo-lightbox hidden" role="dialog" aria-modal="true" aria-label="Popup dialog">
    <button class="btn-close-lightbox" onclick="closeGeneralModal()" aria-label="Close dialog">✕ Close</button>
    <div class="lightbox-content" id="generalModalContent"
         style="background: var(--bg-card); padding: 28px; border-radius: var(--radius-xl); width: 95%; max-width: 500px; color: var(--text-main); display: block; overflow-y: auto; max-height: 82vh; box-shadow: var(--shadow-xl); border: 1.5px solid var(--border-color);">
    </div>
  </div>

  <!-- App Logic -->
  <script src="app.js" defer></script>
</body>
</html>
