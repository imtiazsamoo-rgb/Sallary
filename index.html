<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IBFS Salary & Attendance Portal V2</title>
  <style>
:root {
  --bg: #f4f7fb;
  --panel: #ffffff;
  --text: #172033;
  --muted: #6b7280;
  --line: #e5e7eb;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --danger: #dc2626;
  --warning: #f59e0b;
  --success: #16a34a;
  --dark: #0f172a;
  --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  --radius: 18px;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
.hidden { display: none !important; }
.muted { color: var(--muted); }
label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; font-weight:700; }
select, input, textarea { width:100%; padding:11px 12px; border-radius:12px; border:1px solid var(--line); background:white; color:var(--text); font-size:14px; }
textarea { min-height:90px; resize:vertical; }
button { font: inherit; cursor:pointer; }
.login-view { min-height:100vh; display:grid; place-items:center; padding:18px; }
.login-card { width:100%; max-width:420px; background:white; border:1px solid var(--line); border-radius:24px; padding:24px; box-shadow:var(--shadow); }
.login-brand { margin-bottom:20px; }
.app-shell { min-height: 100vh; display: flex; }
.sidebar { width: 290px; background: var(--dark); color: white; padding: 18px; position: fixed; inset: 0 auto 0 0; overflow-y: auto; z-index: 10; }
.brand { display:flex; gap:12px; align-items:center; padding-bottom:18px; border-bottom:1px solid rgba(255,255,255,0.12); }
.brand-mark { width:48px; height:48px; border-radius:14px; background:var(--primary); display:grid; place-items:center; font-weight:800; color:white; }
.brand h1 { margin:0; font-size:19px; }
.brand p { margin:3px 0 0; color:#cbd5e1; font-size:12px; }
.user-box { margin:16px 0; padding:14px; border-radius:16px; background:rgba(255,255,255,.08); display:grid; gap:4px; }
.user-box span { color:#cbd5e1; font-size:12px; }
.menu { display:grid; gap:6px; }
.menu button { width:100%; border:0; background:transparent; color:#e5e7eb; text-align:left; padding:12px; border-radius:12px; font-size:14px; }
.menu button:hover, .menu button.active { background:rgba(255,255,255,0.12); color:#fff; }
.main { margin-left:290px; width:calc(100% - 290px); }
.topbar { min-height:82px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 26px; position:sticky; top:0; z-index:5; }
.topbar h2 { margin:0; font-size:23px; }
.topbar p { margin:4px 0 0; color:var(--muted); font-size:13px; }
.top-actions { display:flex; gap:10px; align-items:center; }
.top-actions input { width:150px; }
.pill, .status { padding:8px 12px; border-radius:999px; background:#ecfeff; color:#155e75; font-size:13px; white-space:nowrap; font-weight:700; }
.status.pending { background:#fef3c7; color:#92400e; }
.status.approved { background:#dcfce7; color:#166534; }
.status.rejected { background:#fee2e2; color:#991b1b; }
.content { padding:26px; }
.grid { display:grid; gap:18px; }
.stats-grid { grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:18px; }
.module-grid { grid-template-columns:repeat(4,minmax(0,1fr)); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
.stat-card span { color:var(--muted); font-size:13px; }
.stat-card strong { display:block; font-size:28px; margin:8px 0 4px; }
.stat-card small { color:var(--muted); }
.module-card { min-height:135px; transition:.15s ease; }
.module-card:hover { transform:translateY(-2px); }
.module-card .ico { font-size:32px; }
.module-card h3 { margin:10px 0 6px; }
.module-card p { margin:0; color:var(--muted); font-size:13px; line-height:1.4; }
.screen-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
.message { margin:12px 0; padding:13px 14px; border-radius:14px; border:1px solid #fed7aa; background:#fff7ed; color:#9a3412; font-weight:700; }
.message.ok { border-color:#bbf7d0; background:#ecfdf5; color:#166534; }
.message.bad { border-color:#fecaca; background:#fef2f2; color:#991b1b; }
.table-wrap { overflow:auto; border:1px solid var(--line); border-radius:14px; background:white; }
table { width:100%; border-collapse:collapse; min-width:850px; }
th,td { padding:11px; border-bottom:1px solid var(--line); text-align:left; font-size:14px; vertical-align:middle; }
th { background:#f8fafc; font-weight:800; }
td input { min-width:70px; padding:8px; border-radius:10px; }
.btn { border:0; border-radius:12px; padding:11px 16px; background:#e2e8f0; color:#111827; font-weight:800; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn.primary { background:var(--primary); color:white; }
.btn.primary:hover { background:var(--primary-dark); }
.btn.success { background:var(--success); color:white; }
.btn.danger { background:var(--danger); color:white; }
.btn.warning { background:var(--warning); color:#111827; }
.btn.full { width:100%; margin-top:12px; }
.icon-btn { border:0; border-radius:12px; padding:10px 12px; background:#e2e8f0; }
.mobile-only { display:none; }
.actions { display:flex; justify-content:space-between; gap:12px; margin-top:18px; flex-wrap:wrap; }
.wizard { display:grid; gap:18px; }
.steps { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.step { border:1px solid var(--line); border-radius:14px; padding:12px; background:white; color:var(--muted); font-size:13px; }
.step.active { border-color:var(--primary); color:var(--primary-dark); font-weight:800; background:#eff6ff; }
.form-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.upload-box { border:2px dashed #93c5fd; background:#f8fbff; border-radius:18px; padding:18px; }
.photo-list, .photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-top:14px; }
.photo-item { border:1px solid var(--line); border-radius:14px; padding:9px; background:white; }
.photo-item img { width:100%; height:110px; object-fit:cover; border-radius:10px; background:#f1f5f9; }
.review-layout, .approval-layout { display:grid; grid-template-columns:320px 1fr; gap:18px; }
.summary-list { display:grid; gap:10px; }
.summary-row { display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); padding:9px 0; }
.approval-list { display:grid; gap:10px; }
.approval-item { display:flex; justify-content:space-between; align-items:center; gap:12px; border:1px solid var(--line); border-radius:14px; padding:14px; background:white; }
.modal { position:fixed; inset:0; background:rgba(15,23,42,.85); z-index:999; display:grid; place-items:center; padding:18px; }
.modal img { max-width:96vw; max-height:88vh; border-radius:16px; background:white; }
.modal-close { position:fixed; top:18px; right:18px; border:0; border-radius:999px; padding:12px 16px; background:white; color:#111827; font-weight:900; }
@media(max-width:1100px){ .stats-grid,.module-grid{grid-template-columns:repeat(2,minmax(0,1fr));} .review-layout,.approval-layout{grid-template-columns:1fr;} }
@media(max-width:760px){ .mobile-only{display:inline-flex;} .sidebar{transform:translateX(-100%); transition:.2s ease;} .sidebar.open{transform:translateX(0);} .main{margin-left:0; width:100%;} .topbar{align-items:flex-start; flex-direction:column; padding:12px;} .top-actions{width:100%; flex-wrap:wrap;} .top-actions input{width:100%;} .content{padding:12px;} .stats-grid,.module-grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;} .card{padding:14px;} .steps{grid-template-columns:1fr;} .form-grid{grid-template-columns:1fr;} .actions .btn{width:100%;} }

  </style>
</head>
<body>
  <div id="loginView" class="login-view">
    <div class="login-card">
      <div class="brand login-brand">
        <div class="brand-mark">IBFS</div>
        <div>
          <h1>IBFS Portal</h1>
          <p>Salary & Attendance V2</p>
        </div>
      </div>
      <h2>Login</h2>
      <p class="muted">Use your Admin or Principal account.</p>
      <div id="loginMessage"></div>
      <label>Email</label>
      <input id="emailInput" type="email" placeholder="example@gmail.com" autocomplete="username" />
      <label>Password</label>
      <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password" />
      <button class="btn primary full" id="loginBtn">Login</button>
    </div>
  </div>

  <div id="app" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">IBFS</div>
        <div>
          <h1>IBFS Portal</h1>
          <p>Salary & Attendance V2</p>
        </div>
      </div>
      <div class="user-box">
        <strong id="sideUserName">User</strong>
        <span id="sideUserMeta">Role</span>
      </div>
      <nav id="menu" class="menu"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="sidebarToggle">☰</button>
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubTitle">Welcome to IBFS Salary & Attendance Portal</p>
        </div>
        <div class="top-actions">
          <input id="globalMonth" type="month" value="2026-05" />
          <span class="pill" id="currentSchool">School: -</span>
          <button class="btn danger" id="logoutBtn">Logout</button>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="photoModal" class="modal hidden">
    <button class="modal-close" id="closeModal">Close ✕</button>
    <img id="modalImage" alt="Register photo preview" />
  </div>

  <script>
const CONFIG = {
  apiBaseUrl: "https://script.google.com/macros/s/AKfycbwhSGicsU1-wu9w25yRLcNszUdpnbsoywr4FeiB4CYSP7MQf3zkOqoOP92uPrMZg193Cw/exec",
  portalAppId: "salary-system",
  specialSchoolCode: "230101018",
  maxRegisterPhotos: 10
};

const MENUS = {
  admin: [
    ["Dashboard", "📊", "System summary"],
    ["Employees", "👥", "Employee data"],
    ["Employee Approval", "🆕", "New staff approval"],
    ["Attendance Approval", "✅", "Verify register photos"],
    ["Salary Generation", "💰", "Generate monthly salary"],
    ["School Salary Sheets", "📄", "School wise reports"],
    ["Combined Reports", "📚", "Admin combined reports"],
    ["Payslips", "🧾", "Teacher payslips"],
    ["Users", "👤", "User accounts"],
    ["Audit Log", "📝", "Activity history"],
    ["Settings", "⚙️", "Month lock/config"]
  ],
  principal: [
    ["Dashboard", "📊", "My school summary"],
    ["Attendance Entry", "📋", "Fill teacher attendance"],
    ["Attendance Status", "🔎", "Approval status"],
    ["Teachers", "👥", "My school staff"],
    ["Salary Sheet", "📄", "Salary view"],
    ["Payslips", "🧾", "Employee payslips"],
    ["Resignation", "📤", "Resignation request"],
    ["Profile", "👤", "My account"]
  ]
};

const state = {
  user: null,
  activePage: "Dashboard",
  dashboard: null,
  wizardStep: 0,
  attendance: {
    month: "",
    schoolCode: "",
    photos: [],
    staff: []
  },
  selectedApproval: null
};

const $ = (id) => document.getElementById(id);
const content = $("content");
const pageTitle = $("pageTitle");
const pageSubTitle = $("pageSubTitle");
const menu = $("menu");
const sidebar = $("sidebar");

$("loginBtn").addEventListener("click", login);
$("logoutBtn").addEventListener("click", logout);
$("sidebarToggle").addEventListener("click", () => sidebar.classList.toggle("open"));
$("globalMonth").addEventListener("change", () => renderPage());
$("closeModal").addEventListener("click", () => $("photoModal").classList.add("hidden"));

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[c]));
}

function jsString(value) {
  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r/g, "")
    .replace(/\n/g, "\\n");
}

function money(n) {
  return "Rs. " + Number(n || 0).toLocaleString("en-PK");
}

function isAdmin() {
  return state.user && String(state.user.role || "").toLowerCase() === "admin";
}

function getMonth() {
  return $("globalMonth").value || "2026-05";
}

function showMessage(text, type = "") {
  if (!text) return "";
  const cls = type === "ok" ? " ok" : type === "bad" ? " bad" : "";
  return `<div class="message${cls}">${escapeHtml(text)}</div>`;
}

async function apiGet(action, params = {}) {
  const sessionToken = state.user && state.user.sessionToken ? state.user.sessionToken : "";
  const q = new URLSearchParams({ action, sessionToken, ...params });
  const res = await fetch(`${CONFIG.apiBaseUrl}?${q.toString()}`);
  return await res.json();
}

async function apiPost(payload) {
  payload = payload || {};
  if (state.user && state.user.sessionToken && !payload.sessionToken) {
    payload.sessionToken = state.user.sessionToken;
  }
  const res = await fetch(CONFIG.apiBaseUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

async function login() {
  const email = $("emailInput").value.trim();
  const password = $("passwordInput").value.trim();
  const box = $("loginMessage");

  if (!email || !password) {
    box.innerHTML = showMessage("Email and password are required.", "bad");
    return;
  }

  try {
    box.innerHTML = showMessage("Checking login...", "ok");
    const result = await apiGet("login", { email, password });
    if (!result.success) {
      box.innerHTML = showMessage(result.message || "Invalid login.", "bad");
      return;
    }
    state.user = result;
    localStorage.setItem("ibfs_user", JSON.stringify(result));
    renderAfterLogin();
  } catch (err) {
    box.innerHTML = showMessage("API connection failed. Check Apps Script deployment URL.", "bad");
  }
}

async function loginWithPortalToken() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const appId = params.get("appId") || CONFIG.portalAppId;
  if (!token) return false;

  const box = $("loginMessage");
  try {
    box.innerHTML = showMessage("Checking portal session...", "ok");
    const result = await apiPost({ action: "portalLogin", token, appId });
    if (!result.success) {
      box.innerHTML = showMessage(result.message || "Portal access denied. Please login.", "bad");
      return false;
    }
    state.user = result;
    localStorage.setItem("ibfs_user", JSON.stringify(result));
    renderAfterLogin();
    return true;
  } catch (err) {
    box.innerHTML = showMessage("Portal session check failed. Please login.", "bad");
    return false;
  }
}

function logout() {
  localStorage.removeItem("ibfs_user");
  window.history.replaceState({}, "", window.location.origin + window.location.pathname);
  location.reload();
}

function renderAfterLogin() {
  $("loginView").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("sideUserName").textContent = state.user.name || state.user.email;
  $("sideUserMeta").textContent = `${state.user.role} | ${state.user.schoolCode || "ALL"}`;
  $("currentSchool").textContent = `School: ${state.user.schoolCode || "ALL"}`;
  state.activePage = "Dashboard";
  renderMenu();
  renderPage();
}

function renderMenu() {
  const items = MENUS[isAdmin() ? "admin" : "principal"];
  menu.innerHTML = items.map(item => `
    <button class="${item[0] === state.activePage ? "active" : ""}" onclick="openPage('${item[0]}')">
      ${item[1]} ${item[0]}
    </button>
  `).join("");
}

function openPage(page) {
  state.activePage = page;
  sidebar.classList.remove("open");
  renderMenu();
  renderPage();
}

function setHeader(title, subtitle) {
  pageTitle.textContent = title;
  pageSubTitle.textContent = subtitle || "";
}

function renderPage() {
  if (state.activePage === "Dashboard") return renderDashboard();
  if (state.activePage === "Attendance Entry") return renderAttendanceWizard();
  if (state.activePage === "Attendance Approval") return renderAttendanceApproval();
  if (state.activePage === "Attendance Status") return renderAttendanceStatus();
  if (state.activePage === "Teachers" || state.activePage === "Employees") return renderTeachers();
  if (state.activePage === "Payslips") return renderPayslips();
  if (state.activePage === "Salary Sheet" || state.activePage === "School Salary Sheets") return renderSalarySheet();
  if (state.activePage === "Combined Reports") return renderCombinedReports();
  if (state.activePage === "Salary Generation") return renderSalaryGeneration();
  renderPlaceholder(state.activePage);
}

async function renderDashboard() {
  setHeader(isAdmin() ? "Admin Dashboard" : "Principal Dashboard", "Live summary from Apps Script API");
  content.innerHTML = `<div class="card">Loading dashboard...</div>`;
  try {
    const result = await apiGet("dashboard", { email: state.user.email, month: getMonth() });
    if (!result.success) {
      content.innerHTML = showMessage(result.message || "Dashboard loading failed.", "bad");
      return;
    }
    state.dashboard = result;
    const c = result.cards || {};
    const cards = isAdmin()
      ? [
          ["🏫", "Total Schools", c.totalSchools],
          ["👥", "Total Employees", c.totalEmployees],
          ["💰", "Gross Salary", money(c.grossSalary)],
          ["📉", "Deductions", money(c.totalDeductionAmount)],
          ["✅", "Net Salary", money(c.netSalary)],
          ["🟡", "Pending Attendance", c.pendingAttendanceSchools],
          ["🟢", "Approved Attendance", c.approvedAttendanceSchools]
        ]
      : [
          ["👥", "My School Teachers", c.mySchoolTeachers],
          ["💰", "Gross Salary", money(c.grossSalary)],
          ["📉", "Deductions", money(c.totalDeductionAmount)],
          ["✅", "Net Salary", money(c.netSalary)],
          ["📋", "Attendance Status", c.attendanceStatus]
        ];
    const modules = MENUS[isAdmin() ? "admin" : "principal"].filter(m => m[0] !== "Dashboard");
    content.innerHTML = `
      <div class="grid stats-grid">
        ${cards.map(k => `<div class="card stat-card"><span>${k[1]}</span><strong>${k[2] ?? 0}</strong><small>${k[0]}</small></div>`).join("")}
      </div>
      <h3>Modules</h3>
      <div class="grid module-grid">
        ${modules.map(m => `<button class="card module-card" onclick="openPage('${m[0]}')"><div class="ico">${m[1]}</div><h3>${m[0]}</h3><p>${m[2]}</p></button>`).join("")}
      </div>
    `;
  } catch (err) {
    content.innerHTML = showMessage("Dashboard API error.", "bad");
  }
}

function renderPlaceholder(title) {
  setHeader(title, "Module shell");
  content.innerHTML = `<div class="card"><h3>${escapeHtml(title)}</h3><p class="muted">This module screen is ready for the next backend connection.</p></div>`;
}

async function loadPrincipalTeachers() {
  const result = await apiGet("dashboard", { email: state.user.email, month: getMonth() });
  if (!result.success) throw new Error(result.message || "Teachers loading failed.");
  return result.teachers || [];
}

async function renderTeachers() {
  setHeader(isAdmin() ? "Employees" : "Teachers", isAdmin() ? "Employee module shell" : "My school staff list");
  content.innerHTML = `<div class="card">Loading...</div>`;
  if (isAdmin()) {
    content.innerHTML = `<div class="card"><p>Admin employee list API will be connected in Employee Management phase.</p></div>`;
    return;
  }
  try {
    const rows = await loadPrincipalTeachers();
    content.innerHTML = `
      <div class="card">
        <div class="table-wrap"><table>
          <thead><tr><th>S#</th><th>Employee ID</th><th>Name</th><th>Designation</th><th>Basic</th><th>Deduction</th><th>Net</th></tr></thead>
          <tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(r.employeeId)}</td><td>${escapeHtml(r.employeeName)}</td><td>${escapeHtml(r.designation)}</td><td>${money(r.basicSalary)}</td><td>${money(r.deductionAmount)}</td><td><b>${money(r.netSalary)}</b></td></tr>`).join("")}</tbody>
        </table></div>
      </div>`;
  } catch (err) {
    content.innerHTML = showMessage(err.message, "bad");
  }
}

function resetAttendanceIfNeeded() {
  const month = getMonth();
  const schoolCode = state.user.schoolCode || "";
  if (state.attendance.month !== month || state.attendance.schoolCode !== schoolCode) {
    state.wizardStep = 0;
    state.attendance = { month, schoolCode, photos: [], staff: [] };
  }
}

async function renderAttendanceWizard() {
  setHeader("Attendance Entry", "Month → Register Photos → Staff Attendance Table → Review → Submit");
  resetAttendanceIfNeeded();
  if (isAdmin()) {
    content.innerHTML = showMessage("Admin cannot submit attendance. Use Attendance Approval module.", "bad");
    return;
  }
  if (!state.attendance.staff.length) {
    content.innerHTML = `<div class="card">Loading teacher list...</div>`;
    try {
      const rows = await loadPrincipalTeachers();
      state.attendance.staff = rows.map(t => ({
        employeeId: t.employeeId,
        employeeName: t.employeeName,
        designation: t.designation,
        absent: 0,
        cl: 0,
        medicalLeave: 0,
        withoutPayLeave: 0,
        remarks: ""
      }));
    } catch (err) {
      content.innerHTML = showMessage(err.message, "bad");
      return;
    }
  }
  const steps = ["Month", "Register Photos", "Staff Attendance", "Review"];
  content.innerHTML = `
    <div class="wizard">
      <div class="steps">${steps.map((s,i)=>`<div class="step ${i===state.wizardStep?"active":""}">${i+1}. ${s}</div>`).join("")}</div>
      <div class="card" id="wizardBody"></div>
    </div>`;
  renderWizardBody();
}

function renderWizardBody() {
  const body = $("wizardBody");
  if (state.wizardStep === 0) body.innerHTML = monthStepHtml();
  if (state.wizardStep === 1) body.innerHTML = photosStepHtml();
  if (state.wizardStep === 2) body.innerHTML = staffStepHtml();
  if (state.wizardStep === 3) body.innerHTML = reviewStepHtml();
  bindWizardEvents();
}

function monthStepHtml() {
  return `
    <h3>Select Attendance Month</h3>
    <div class="form-grid">
      <div><label>School Code</label><input value="${escapeHtml(state.attendance.schoolCode)}" readonly></div>
      <div><label>Month</label><input id="attMonth" type="month" value="${escapeHtml(state.attendance.month)}"></div>

function bindWizardEvents() {
  const next = $("nextStep");
  const prev = $("prevStep");
  if (next) next.onclick = () => { saveCurrentWizardStep(); if (!validateWizardStep()) return; state.wizardStep = Math.min(3, state.wizardStep + 1); renderAttendanceWizard(); };
  if (prev) prev.onclick = () => { saveCurrentWizardStep(); state.wizardStep = Math.max(0, state.wizardStep - 1); renderAttendanceWizard(); };
  const attMonth = $("attMonth");
  if (attMonth) attMonth.onchange = () => { state.attendance.month = attMonth.value; $("globalMonth").value = attMonth.value; };
  const fileInput = $("registerPhotos");
  if (fileInput) fileInput.onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    for (const file of files) {
      if (state.attendance.photos.length >= CONFIG.maxRegisterPhotos) break;
      state.attendance.photos.push(await fileToBase64Object(file));
    }
    renderAttendanceWizard();
  };
  document.querySelectorAll("[data-remove-photo]").forEach(btn => btn.onclick = () => { state.attendance.photos.splice(Number(btn.dataset.removePhoto),1); renderAttendanceWizard(); });
  document.querySelectorAll("[data-field]").forEach(input => input.onchange = () => {
    const row = state.attendance.staff[Number(input.dataset.index)];
    const field = input.dataset.field;
    row[field] = field === "remarks" ? input.value : Number(input.value || 0);
    renderAttendanceWizard();
    state.wizardStep = 2;
  });
  const submit = $("submitAttendance");
  if (submit) submit.onclick = submitAttendance;
}

function saveCurrentWizardStep() {
  const month = $("attMonth");
  if (month) { state.attendance.month = month.value; $("globalMonth").value = month.value; }
}

function validateWizardStep() {
  if (state.wizardStep === 0 && !state.attendance.month) { alert("Please select month."); return false; }
  if (state.wizardStep === 1 && state.attendance.photos.length === 0) { alert("Register photo is compulsory."); return false; }
  return true;
}

function calculateDeductionDays(row, schoolCode) {
  const allowed = String(schoolCode) === CONFIG.specialSchoolCode ? 1 : 2;
  const combined = Number(row.cl || 0) + Number(row.medicalLeave || 0);
  return Number(row.absent || 0) + Number(row.withoutPayLeave || 0) + Math.max(0, combined - allowed);
}

function attendanceSummary() {
  return state.attendance.staff.reduce((a,r)=>{
    a.totalStaff++;
    a.absent += Number(r.absent || 0);
    a.cl += Number(r.cl || 0);
    a.medical += Number(r.medicalLeave || 0);
    a.wpl += Number(r.withoutPayLeave || 0);
    a.deductionDays += calculateDeductionDays(r,state.attendance.schoolCode);
    return a;
  }, { totalStaff:0, photos:state.attendance.photos.length, absent:0, cl:0, medical:0, wpl:0, deductionDays:0 });
}

function fileToBase64Object(file) {
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = () => {
      const dataUrl = String(r.result || "");
      resolve({ fileName:file.name, mimeType:file.type || "image/jpeg", dataUrl, base64:dataUrl.split(",")[1] || "" });
    };
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

}

function extractDriveFileId(url) {
  const text = String(url || "");
  let match = text.match(/\/file\/d\/([^/]+)/);
  if (match) return match[1];

  match = text.match(/\/d\/([^/]+)/);
  if (match) return match[1];

  match = text.match(/[?&]id=([^&]+)/);
  if (match) return match[1];

  match = text.match(/[-\w]{25,}/);
  if (match) return match[0];

  return "";
}

function driveThumbnailUrl(url, size = "w200") {
  const id = extractDriveFileId(url);
  if (!id) return String(url || "");
  return `https://drive.google.com/thumbnail?id=${id}&sz=${size}`;
}

function driveImageUrl(url) {
  return driveThumbnailUrl(url, "w1000");
}

  if (!el) return;

  if (loadingText) {
    el.innerHTML = showMessage(loadingText, "ok");
    return;
  }

  const pdfUrl = getPdfUrl(result);

  if (result && result.success) {
    el.innerHTML = `
      <div class="message ok">
        ${escapeHtml(result.message || "PDF generated successfully.")}<br><br>
        ${pdfUrl ? `<a class="btn success" href="${escapeHtml(pdfUrl)}" target="_blank" rel="noopener">Open / Download PDF</a>` : `<span class="muted">PDF generated, but download link was not returned.</span>`}
      </div>
    `;
    return;
  }

  el.innerHTML = showMessage(
    (result && result.message) ? result.message : "PDF generation failed.",
    "bad"
  );
}

}
